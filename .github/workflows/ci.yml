name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint "{src,apps,libs,test,scripts}/**/*.ts"
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Build
        run: npm run build
      - name: Compiled app loads
        run: node -e "require('./dist/app.module')"
      - name: Unit tests
        run: npm test
      - name: E2E tests
        run: npm run test:e2e
      - name: OpenAPI spec is up to date
        run: npm run openapi:check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
