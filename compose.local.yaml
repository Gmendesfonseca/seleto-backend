services:
  postgres:
    image: postgres:15-alpine
    container_name: tg-postgres
    environment:
      POSTGRES_DB: db_database
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tg-network

  redis:
    image: redis:7-alpine
    container_name: tg-redis
    ports:
      - "6379:6379"
    networks:
      - tg-network

  mongo:
    image: mongo:7
    container_name: tg-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - tg-network

  main:
    container_name: tg-backend
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "5000:80"
    command: npm run start:debug
    volumes:
      - .:/home/node/app
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
    depends_on:
      - postgres
      - redis
      - mongo
    networks:
      - tg-network

volumes:
  postgres_data:
  mongo_data:

networks:
  tg-network:
    driver: bridge
