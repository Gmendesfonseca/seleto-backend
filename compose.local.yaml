services:
  main:
    container_name: tg-backend
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "5000:80"
    command: npm run start:debug
    volumes:
      - .:/home/node/app
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
    networks:
      - laravel-network

networks:
  laravel-network:
    external: true
